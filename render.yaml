# Đưa AutoTrading VN lên Internet bằng Render (https://render.com): Dashboard → New → Blueprint → chọn repo này.
# Chi phí: gói Starter (~7 USD/tháng) + ổ đĩa 1 GB (~0,25 USD/tháng). Gói Free KHÔNG có ổ đĩa bền vững (mất dữ liệu).
# Hướng dẫn chi tiết: README.md, mục "Web trên Internet".
services:
  - type: web
    name: autotrading-vn
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore          # gần Việt Nam nhất
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: autotrading-data
      mountPath: /app/backend/data
      sizeGB: 1
    envVars:
      - key: SETUP_CODE         # mã bạn tự đặt (≥ 12 ký tự) để tạo tài khoản quản trị đầu tiên trên web
        sync: false
      - key: ANTHROPIC_API_KEY  # tùy chọn: khóa Claude API cho AI Agent (để trống = chế độ cơ bản)
        sync: false
      - key: DATA_MODE
        value: auto
      - key: PROXY_HOPS         # Render đứng trước ứng dụng 1 lớp proxy → lấy đúng IP người dùng
        value: "1"
      - key: TZ
        value: ICT-7            # giờ Việt Nam (UTC+7)
